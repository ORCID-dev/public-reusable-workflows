name: sast

on:
  workflow_call:
    inputs:
      java-version:
        description: Set to generate Maven dependency trees for Semgrep Supply Chain.
        type: string
        default: ''
      split:
        description: Run supply chain and code scans separately.
        type: boolean
        default: false
      quiet:
        description: Keep findings out of the job log.
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 30
    secrets:
      semgrep-app-token:
        required: false

permissions: {}

jobs:
  semgrep:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # renovate: datasource=pypi depName=semgrep
      SEMGREP_VERSION: 1.186.0
      # renovate: datasource=maven depName=org.apache.maven.plugins:maven-dependency-plugin
      DEPENDENCY_PLUGIN_VERSION: 3.11.0
      HAS_TOKEN: ${{ secrets.semgrep-app-token != '' }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::No Semgrep token, scan skipped."

      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: env.HAS_TOKEN == 'true' && inputs.java-version != ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      # Restore only, newest cache saved by build.yml.
      - if: env.HAS_TOKEN == 'true' && inputs.java-version != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/orcid
          key: maven-${{ runner.os }}-${{ hashFiles('./**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-${{ hashFiles('./**/pom.xml') }}-
            maven-${{ runner.os }}-

      # Top-level POMs only: a reactor build covers its own modules.
      # Full plugin coordinates: the dependency:tree prefix looks up metadata on Maven Central at every run.
      - if: env.HAS_TOKEN == 'true' && inputs.java-version != ''
        run: |
          find . -name pom.xml -not -path '*/target/*' -not -path '*/node_modules/*' | sort | while read -r pom; do
            parent=$(dirname "$pom")
            nested=false
            while [ "$parent" != "." ]; do
              parent=$(dirname "$parent")
              if [ -f "$parent/pom.xml" ]; then nested=true; break; fi
            done
            if [ "$nested" = false ]; then
              mvn -B -ntp -q -f "$pom" "org.apache.maven.plugins:maven-dependency-plugin:${DEPENDENCY_PLUGIN_VERSION}:tree" \
                -DoutputFile=maven_dep_tree.txt
            fi
          done

      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - if: env.HAS_TOKEN == 'true'
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"

      - if: env.HAS_TOKEN == 'true'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.semgrep-app-token }}
          SPLIT: ${{ inputs.split }}
          QUIET: ${{ inputs.quiet }}
        run: |
          out=/dev/stdout
          if [ "$QUIET" = true ]; then out=/dev/null; fi
          if [ "$SPLIT" = true ]; then
            semgrep ci --supply-chain >"$out" 2>&1
            semgrep ci --code >"$out" 2>&1
          else
            semgrep ci >"$out" 2>&1
          fi

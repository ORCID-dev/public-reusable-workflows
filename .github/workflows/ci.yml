name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # $/ syntax not supported by actionlint 1.7.12 yet
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository]

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=pypi depName=zizmor
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check "zizmor==${ZIZMOR_VERSION}"
      - run: zizmor --format github .
        env:
          GH_TOKEN: ${{ github.token }}

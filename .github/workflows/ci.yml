name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      contents: read
    # $/ syntax not supported by actionlint 1.7.12 yet
    uses: ./.github/workflows/lint.yml # zizmor: ignore[self-repository]

  sast:
    permissions:
      contents: read
    uses: ./.github/workflows/sast.yml # zizmor: ignore[self-repository]
    with:
      java-version: '21'
    secrets:
      semgrep-app-token: ${{ secrets.SEMGREP_APP_TOKEN }}

  version:
    permissions:
      contents: read
    uses: ./.github/workflows/version.yml # zizmor: ignore[self-repository]

  version-outputs:
    needs: version
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          LAST: ${{ needs.version.outputs.last-tag }}
        run: |
          test -n "$VERSION" && test "$TAG" = "v$VERSION" && test -n "$LAST"
          echo "$LAST -> $TAG"

  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      name: build
      modules: '["lib", "app"]'
      java-version: '21'
      upload: fixtures/maven/{module}/target/*.jar
      run: |
        test -n "$FIXTURE_TOKEN"
        mvn -f fixtures/maven/pom.xml -pl "$MODULE" -am verify
    secrets:
      env-vars: FIXTURE_TOKEN=${{ secrets.GITHUB_TOKEN }}

  maven-cache:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      name: maven-cache
      java-version: '21'
      cache: save
      run: mvn -f fixtures/maven/pom.xml verify

  node-yarn:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      name: node-yarn
      node-version: '24'
      cache: save
      working-directory: fixtures/node-yarn
      run: test "$(node -p "require('ms')(60000)")" = 1m

  node-npm:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      name: node-npm
      node-version: '24'
      cache: save
      working-directory: fixtures/node-npm
      run: test "$(node -p "require('ms')(60000)")" = 1m

  node-pnpm:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml # zizmor: ignore[self-repository]
    with:
      name: node-pnpm
      node-version: '24'
      cache: save
      working-directory: fixtures/node-pnpm
      run: test "$(node -p "require('ms')(60000)")" = 1m

  # The jar of one module goes into an image, the way member-services does it.
  docker-jar:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/docker.yml # zizmor: ignore[self-repository]
    with:
      name: docker-jar
      images: '[{"name": "fixture/jar", "context": "fixtures/docker-jar", "artifact": "build-app", "artifact-path": "fixtures/docker-jar/target"}]'
      version: 0.0.0

  docker:
    permissions:
      contents: read
    uses: ./.github/workflows/docker.yml # zizmor: ignore[self-repository]
    with:
      name: docker
      images: '[{"name": "fixture/hello", "file": "fixtures/docker/Dockerfile"}]'
      context: fixtures/docker
      version: 0.0.0
      build-args: GREETING=ci

  test:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck tests/*.sh
      - run: bash tests/version.sh
      - run: bash tests/build.sh
      - run: bash tests/docker.sh
      - run: bash tests/release.sh
      - run: bash tests/pages.sh
      - run: bash tests/transifex.sh
      - run: bash tests/gate.sh

  zizmor:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=pypi depName=zizmor
      ZIZMOR_VERSION: 1.32.0
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check "zizmor==${ZIZMOR_VERSION}"
      - run: zizmor --format github .
        env:
          GH_TOKEN: ${{ github.token }}

  # The one required check: it follows every job above, so adding or renaming a job never touches the branch rules.
  ok:
    if: always()
    needs: [lint, sast, version, version-outputs, build, maven-cache, node-yarn, node-npm, node-pnpm, docker-jar, docker, test, zizmor]
    permissions: {}
    uses: ./.github/workflows/gate.yml # zizmor: ignore[self-repository]
    with:
      needs: ${{ toJSON(needs) }}

name: build

on:
  workflow_call:
    inputs:
      name:
        description: Job name; the check shows as `<caller job> / <name> (<module>)`.
        type: string
        required: true
      run:
        description: Script to run. MODULE and VERSION are exported.
        type: string
        required: true
      modules:
        description: JSON array, one job per entry.
        type: string
        default: '[""]'
      fail-fast:
        type: boolean
        default: true
      version:
        type: string
        default: ''
      java-version:
        type: string
        default: ''
      node-version:
        type: string
        default: ''
      node-version-file:
        type: string
        default: ''
      python-version:
        type: string
        default: ''
      cache:
        description: restore, save (one job only; saves on the default branch after a miss) or none.
        type: string
        default: restore
      working-directory:
        type: string
        default: .
      fetch-depth:
        type: number
        default: 1
      timeout-minutes:
        type: number
        default: 30
    secrets:
      env-vars:
        description: KEY=value lines exported to the script, each value masked.
        required: false

permissions: {}

jobs:
  run:
    name: ${{ inputs.name }}${{ matrix.module != '' && format(' ({0})', matrix.module) || '' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        module: ${{ fromJSON(inputs.modules) }}
    env:
      MODULE: ${{ matrix.module }}
      VERSION: ${{ inputs.version }}
      MAVEN_ARGS: -B -ntp
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - if: inputs.java-version != ''
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - if: inputs.node-version != '' || inputs.node-version-file != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          node-version-file: ${{ inputs.node-version-file }}
          package-manager-cache: false

      - if: inputs.python-version != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}

      # Weekly key: an exact hit is never re-saved, so the week bounds how stale a cache gets.
      - if: inputs.java-version != '' && inputs.cache != 'none'
        id: maven-key
        env:
          POM_HASH: ${{ hashFiles(format('{0}/**/pom.xml', inputs.working-directory)) }}
        run: |
          prefix="maven-${RUNNER_OS}-${POM_HASH}-"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "key=${prefix}$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - if: steps.maven-key.outputs.key != ''
        id: maven-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/orcid
          key: ${{ steps.maven-key.outputs.key }}
          restore-keys: |
            ${{ steps.maven-key.outputs.prefix }}
            maven-${{ runner.os }}-

      # OS release and Node ABI in the node_modules key: native binaries depend on both.
      - if: inputs.node-version != '' || inputs.node-version-file != ''
        id: node
        working-directory: ${{ inputs.working-directory }}
        env:
          LOCK_HASH: ${{ hashFiles(format('{0}/yarn.lock', inputs.working-directory), format('{0}/package-lock.json', inputs.working-directory)) }}
        run: |
          if [ -f yarn.lock ]; then
            pm=yarn dir=$(yarn cache dir)
          elif [ -f package-lock.json ]; then
            pm=npm dir=$(npm config get cache)
          else
            exit 0
          fi
          . /etc/os-release
          os="$ID$VERSION_ID-$RUNNER_ARCH"
          {
            echo "pm=$pm"
            echo "dir=$dir"
            echo "prefix=$pm-$os-"
            echo "key=$pm-$os-$LOCK_HASH"
            echo "modules-key=node-modules-$os-abi$(node -p process.versions.modules)-$LOCK_HASH"
          } >> "$GITHUB_OUTPUT"

      # yarn only, npm ci deletes node_modules. Exact key only: a tree from another lockfile can keep stale packages.
      - if: steps.node.outputs.pm == 'yarn' && inputs.cache != 'none'
        id: node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ steps.node.outputs.modules-key }}

      # A partial download cache still helps: the package manager checks every package against the lockfile.
      - if: steps.node.outputs.pm != '' && inputs.cache != 'none' && steps.node-modules.outputs.cache-hit != 'true'
        id: node-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.node.outputs.dir }}
          key: ${{ steps.node.outputs.key }}
          restore-keys: ${{ steps.node.outputs.prefix }}

      # Before env-vars are exported, so install scripts never see the secrets.
      - if: steps.node.outputs.pm != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          PM: ${{ steps.node.outputs.pm }}
        run: |
          if [ "$PM" = yarn ]; then
            yarn install --frozen-lockfile --non-interactive
          else
            npm ci --no-audit --no-fund
          fi

      - if: >-
          inputs.cache == 'save' && steps.node.outputs.pm == 'yarn' &&
          steps.node-modules.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.working-directory }}/node_modules
          key: ${{ steps.node.outputs.modules-key }}

      - if: >-
          inputs.cache == 'save' && steps.node.outputs.pm != '' &&
          steps.node-modules.outputs.cache-hit != 'true' && steps.node-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.node.outputs.dir }}
          key: ${{ steps.node.outputs.key }}

      - id: run
        working-directory: ${{ inputs.working-directory }}
        env:
          RUN: ${{ inputs.run }}
          ENV_VARS: ${{ secrets.env-vars }}
        run: |
          n=0
          while IFS= read -r line; do
            n=$((n + 1))
            [ -n "$line" ] || continue
            if ! [[ $line =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::env-vars line $n is not KEY=value"
              exit 1
            fi
            key=${line%%=*}
            value=${line#*=}
            if [ -n "$value" ]; then echo "::add-mask::$value"; fi
            export "$key=$value"
          done <<< "$ENV_VARS"
          unset ENV_VARS
          bash -eo pipefail -c "$RUN"

      - if: >-
          inputs.cache == 'save' && steps.maven-key.outputs.key != '' &&
          steps.maven-cache.outputs.cache-hit != 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/orcid
          key: ${{ steps.maven-key.outputs.key }}

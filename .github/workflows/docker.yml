name: docker

on:
  workflow_call:
    inputs:
      name:
        description: Job name; the check shows as `<caller job> / <name> (<image>)`.
        type: string
        required: true
      images:
        description: >-
          JSON array of {"name", "file", "context", "build-args", "artifact", "artifact-path"}. Only name is required;
          file defaults to <context>/Dockerfile, and artifact (e.g. a jar from build.yml `upload`) is downloaded to artifact-path.
        type: string
        required: true
      context:
        type: string
        default: .
      version:
        description: Image tag. Required to push.
        type: string
        default: ''
      build-args:
        description: KEY=value lines. Not for secrets.
        type: string
        default: ''
      push:
        description: Push the tag and the `:cache` build cache. Never on pull_request events.
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 45
    secrets:
      registry:
        required: false
      username:
        required: false
      password:
        required: false

permissions: {}

jobs:
  build:
    name: ${{ inputs.name }} (${{ matrix.image.name }})
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      BUILDKIT_IMAGE: moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: matrix.image.artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.image.artifact }}
          path: ${{ matrix.image.artifact-path }}

      # Outside the ORCID org every image goes under vd_test/, so a test can't overwrite a production tag.
      - id: image
        env:
          NAME: ${{ matrix.image.name }}
          FILE: ${{ matrix.image.file }}
          CONTEXT: ${{ matrix.image.context || inputs.context }}
          VERSION: ${{ inputs.version }}
          PUSH: ${{ inputs.push }}
          REGISTRY: ${{ secrets.registry }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
        run: |
          if ! [[ $NAME =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
            echo "::error::Invalid image name: $NAME"
            exit 1
          fi
          if [ -n "$VERSION" ] && ! [[ $VERSION =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          # Repository paths only: a context like / or .. would send files outside the checkout to the build.
          segment='[A-Za-z0-9_][A-Za-z0-9._-]*'
          file=${FILE:-$CONTEXT/Dockerfile}
          file=${file#./}
          for path in "$CONTEXT" "$file"; do
            if [ "$path" != . ] && ! [[ $path =~ ^$segment(/$segment)*$ ]]; then
              echo "::error::Invalid path: $path"
              exit 1
            fi
          done
          if [ "$OWNER" != ORCID ]; then NAME="vd_test/$NAME"; fi
          ref="${REGISTRY:+$REGISTRY/}$NAME"
          push=false
          if [ "$PUSH" = true ]; then
            if [[ $EVENT == pull_request* ]]; then
              echo "::notice::No push on $EVENT"
            elif [ -z "$REGISTRY" ] || [ -z "$VERSION" ]; then
              echo "::error::push needs the registry secret and a version"
              exit 1
            else
              push=true
            fi
          fi
          {
            echo "ref=$ref"
            echo "tag=$ref:${VERSION:-ci}"
            echo "context=$CONTEXT"
            echo "file=$file"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"

      - if: steps.image.outputs.push == 'true'
        env:
          REGISTRY: ${{ secrets.registry }}
          USERNAME: ${{ secrets.username }}
          PASSWORD: ${{ secrets.password }}
        run: docker login --username "$USERNAME" --password-stdin "$REGISTRY" <<< "$PASSWORD"

      # The default docker driver can't export a registry cache.
      - run: |
          docker buildx create --use --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE"
          docker buildx inspect --bootstrap > /dev/null

      - id: build
        env:
          FILE: ${{ steps.image.outputs.file }}
          REF: ${{ steps.image.outputs.ref }}
          TAG: ${{ steps.image.outputs.tag }}
          PUSH: ${{ steps.image.outputs.push }}
          CONTEXT: ${{ steps.image.outputs.context }}
          BUILD_ARGS: ${{ inputs.build-args }}
          IMAGE_BUILD_ARGS: ${{ matrix.image.build-args }}
        run: |
          args=(--file "$FILE" --tag "$TAG")
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            if ! [[ $line =~ ^[A-Za-z_][A-Za-z0-9_]*= ]]; then
              echo "::error::build-args line is not KEY=value"
              exit 1
            fi
            args+=(--build-arg "$line")
          done <<< "$BUILD_ARGS"$'\n'"$IMAGE_BUILD_ARGS"
          if [ "$PUSH" = true ]; then
            args+=(--push --cache-from "type=registry,ref=$REF:cache"
              --cache-to "type=registry,ref=$REF:cache,mode=max,image-manifest=true,oci-mediatypes=true")
          fi
          docker buildx build "${args[@]}" "$CONTEXT"
